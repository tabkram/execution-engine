name: Pull request

on:
  pull_request:
    types: [ opened, synchronize, reopened, labeled, closed ]
    branches:
      - 'main'

permissions:
  contents: read

jobs:

  ci:
    name: CI
    if: |
      github.event.action != 'closed' &&
      (github.event.action != 'labeled' || github.event.label.name == 'deploy')
    uses: ./.github/workflows/_build.yml

  compute-version:
    name: Compute version
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'deploy') &&
      contains(github.event.pull_request.labels.*.name, 'deploy') &&
      (startsWith(github.head_ref, 'feat/') ||
       startsWith(github.head_ref, 'feature/') ||
       startsWith(github.head_ref, 'fix/') ||
       startsWith(github.head_ref, 'ci/'))

    outputs:
      canary_prefix: ${{ steps.generate_canary_version.outputs.canary_prefix }}
      canary_version: ${{ steps.generate_canary_version.outputs.canary_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Generate Canary Version
        id: generate_canary_version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          PR_NUMBER=${{ github.event.pull_request.number }}
          COMMIT_HASH=${GITHUB_SHA::7}

          CANARY_PREFIX="${BASE_VERSION}-canary.${PR_NUMBER}"
          CANARY_VERSION="${CANARY_PREFIX}.${COMMIT_HASH}"
          
          echo "CANARY_PREFIX=${CANARY_PREFIX}"
          echo "CANARY_VERSION=${CANARY_VERSION}"
          
          echo "CANARY_PREFIX=${CANARY_PREFIX}" >> $GITHUB_ENV
          echo "CANARY_VERSION=${CANARY_VERSION}" >> $GITHUB_ENV
          
          echo "canary_prefix=${CANARY_PREFIX}" >> $GITHUB_OUTPUT
          echo "canary_version=${CANARY_VERSION}" >> $GITHUB_OUTPUT


  publish-version:
    name: Publish
    runs-on: ubuntu-latest
    needs: [ ci , compute-version ]
    if: github.event.action != 'closed'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      CANARY_CLEANUP_ENABLED: ${{ secrets.NPM_TOKEN != '' }}
    environment:
      name: canary
      url: https://www.npmjs.com/package/execution-engine/v/${{ needs.compute-version.outputs.canary_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Remove old Canary versions (optional)
        id: unpublish_canary
        if: env.CANARY_CLEANUP_ENABLED == 'true'
        continue-on-error: true
        uses: ./.github/actions/unpublish-prefix
        with:
          version_prefix: ${{ needs.compute-version.outputs.canary_prefix }}
          confirm: 'I confirm to unpublish'
          npm_token: ${{ secrets.NPM_TOKEN }}

      - name: Install npm with OIDC support
        run: npm install --global npm@11 --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --runInBand

      - name: Bump version and publish canary using OIDC
        env:
          CANARY_VERSION: ${{ needs.compute-version.outputs.canary_version }}
        run: |
          npm version "$CANARY_VERSION" --no-git-tag-version
          npm publish --access public --tag canary

      - name: Prepare cleanup message
        env:
          CLEANUP_STATUS: ${{ steps.unpublish_canary.outcome }}
          REMOVED_VERSIONS: ${{ steps.unpublish_canary.outputs.UNPUBLISHED_VERSIONS_BY_PREFIX }}
        run: |
          if [[ "$CLEANUP_STATUS" == "skipped" ]]; then
            MESSAGE="Cleanup skipped: NPM_TOKEN is not configured."
          elif [[ "$CLEANUP_STATUS" == "failure" ]]; then
            MESSAGE="Cleanup failed; the new canary was still published."
          else
            MESSAGE="Unpublished versions: ${REMOVED_VERSIONS:-none}."
          fi
          echo "cleanup_message=$MESSAGE" >> "$GITHUB_ENV"

      - name: Comment on PR with deployed Version
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ${{ env.cleanup_message }}
            ✅ **Created Version:** `${{ needs.compute-version.outputs.canary_version }}`
            📦 **Published on NPM:** [View on NPM](https://www.npmjs.com/package/execution-engine/v/${{ needs.compute-version.outputs.canary_version }})

            > The `canary` tag points to the latest canary. Cleanup of previous versions is best-effort.
          reactions: 'rocket'

  unpublish_version:
    name: Unpublish
    runs-on: ubuntu-latest
    needs: compute-version
    if: github.event.action == 'closed'
    permissions:
      contents: read
      pull-requests: write
    env:
      CANARY_CLEANUP_ENABLED: ${{ secrets.NPM_TOKEN != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Remove old Canary versions (optional)
        id: unpublish_canary_2
        if: env.CANARY_CLEANUP_ENABLED == 'true'
        continue-on-error: true
        uses: ./.github/actions/unpublish-prefix
        with:
          version_prefix: ${{ needs.compute-version.outputs.canary_prefix }}
          confirm: 'I confirm to unpublish'
          npm_token: ${{ secrets.NPM_TOKEN }}

      - name: Prepare cleanup message
        env:
          CLEANUP_STATUS: ${{ steps.unpublish_canary_2.outcome }}
          REMOVED_VERSIONS: ${{ steps.unpublish_canary_2.outputs.UNPUBLISHED_VERSIONS_BY_PREFIX }}
        run: |
          if [[ "$CLEANUP_STATUS" == "skipped" ]]; then
            MESSAGE="Cleanup skipped: NPM_TOKEN is not configured."
          elif [[ "$CLEANUP_STATUS" == "failure" ]]; then
            MESSAGE="Cleanup failed; existing canary versions were kept."
          else
            MESSAGE="Unpublished versions: ${REMOVED_VERSIONS:-none}."
          fi
          echo "cleanup_message=$MESSAGE" >> "$GITHUB_ENV"

      - name: Comment on PR with deployed Version
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ${{ env.cleanup_message }}
          reactions: 'rocket'
