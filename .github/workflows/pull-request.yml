name: Pull request

on:
  pull_request:
    types: [ opened, synchronize, reopened, labeled, closed ]
    branches:
      - 'main'

permissions:
  contents: read

concurrency:
  group: pr-canary-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:

  ci:
    name: CI
    if: |
      github.event.action != 'closed' &&
      (github.event.action != 'labeled' || github.event.label.name == 'deploy')
    uses: ./.github/workflows/_build.yml

  compute-version:
    name: Compute version
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.state == 'open' &&
      (github.event.action != 'labeled' || github.event.label.name == 'deploy') &&
      contains(github.event.pull_request.labels.*.name, 'deploy') &&
      (startsWith(github.head_ref, 'feat/') ||
       startsWith(github.head_ref, 'feature/') ||
       startsWith(github.head_ref, 'fix/') ||
       startsWith(github.head_ref, 'ci/'))

    outputs:
      canary_version: ${{ steps.generate_canary_version.outputs.canary_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Generate Canary Version
        id: generate_canary_version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          PR_NUMBER=${{ github.event.pull_request.number }}
          COMMIT_HASH=${GITHUB_SHA::7}

          CANARY_PREFIX="${BASE_VERSION}-canary.${PR_NUMBER}"
          CANARY_VERSION="${CANARY_PREFIX}.${COMMIT_HASH}"
          
          echo "CANARY_PREFIX=${CANARY_PREFIX}"
          echo "CANARY_VERSION=${CANARY_VERSION}"
          
          echo "canary_version=${CANARY_VERSION}" >> $GITHUB_OUTPUT


  deprecate_previous_versions:
    name: Deprecate previous canaries
    runs-on: ubuntu-latest
    needs: [ ci, compute-version ]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deprecate previous canaries for this PR
        uses: ./.github/actions/deprecate-prefix
        with:
          pr_number: ${{ github.event.pull_request.number }}
          keep_version: ${{ needs.compute-version.outputs.canary_version }}
          npm_token: ${{ secrets.NPM_TOKEN }}

  publish-version:
    name: Publish
    runs-on: ubuntu-latest
    needs: [ ci, compute-version, deprecate_previous_versions ]
    if: |
      !cancelled() &&
      needs.ci.result == 'success' &&
      needs.compute-version.result == 'success' &&
      (needs.deprecate_previous_versions.result == 'success' || needs.deprecate_previous_versions.result == 'skipped') &&
      github.event.action != 'closed'
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    environment:
      name: canary
      url: https://www.npmjs.com/package/execution-engine/v/${{ needs.compute-version.outputs.canary_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install npm with OIDC support
        run: npm install --global npm@11 --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --runInBand

      - name: Bump version and publish canary using OIDC
        env:
          CANARY_VERSION: ${{ needs.compute-version.outputs.canary_version }}
        run: |
          npm version "$CANARY_VERSION" --no-git-tag-version
          npm publish --access public --tag canary

      - name: Comment on PR with deployed Version
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ✅ **Created Version:** `${{ needs.compute-version.outputs.canary_version }}`
            📦 **Published on NPM:** [View on NPM](https://www.npmjs.com/package/execution-engine/v/${{ needs.compute-version.outputs.canary_version }})

            > The `canary` tag points to the latest canary.
          reactions: 'rocket'

  deprecate_versions:
    name: Deprecate
    runs-on: ubuntu-latest
    if: |
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Deprecate all canaries for the closed PR
        id: deprecate_canaries
        uses: ./.github/actions/deprecate-prefix
        with:
          pr_number: ${{ github.event.pull_request.number }}
          npm_token: ${{ secrets.NPM_TOKEN }}

      - name: Report verified deprecations
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: "Verified deprecated versions: ${{ steps.deprecate_canaries.outputs.DEPRECATED_VERSIONS || 'none' }}."
