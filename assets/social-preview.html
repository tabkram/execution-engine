<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: #0c0c1a;
    -webkit-font-smoothing: antialiased;
  }

  .stage {
    position: relative;
    width: 1280px;
    height: 640px;
    overflow: hidden;
    background:
      radial-gradient(760px 580px at 91% 28%, rgba(65,209,255,0.11), transparent 70%),
      radial-gradient(820px 580px at 2% 0%, rgba(109,92,231,0.22), transparent 68%),
      #0c0c1a;
  }

  /* ---------------- left column ---------------- */
  .brand {
    position: absolute; left: 64px; top: 34px;
    display: flex; align-items: center; gap: 10px;
    color: #f2f0ff;
    font-size: 18px; font-weight: 650; letter-spacing: -0.01em;
  }
  .brand .mark { width: 29px; height: 29px; }

  .left { position: absolute; left: 64px; top: 111px; width: 620px; }

  .eyebrow {
    margin-bottom: 13px;
  }
  .eyebrow .txt {
    font-size: 13px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: #9d93d8;
  }

  .wordmark {
    font-size: 72px; font-weight: 800; line-height: 1.1; letter-spacing: -0.035em;
    white-space: nowrap;
    background: linear-gradient(118deg, #ffffff 8%, #cfc7ff 52%, #7fdcff 96%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    padding-bottom: 5px;
  }

  .tagline {
    margin-top: 16px;
    font-size: 29px; font-weight: 600; line-height: 1.3; letter-spacing: -0.015em;
    color: #e0dcf3;
  }

  .support {
    margin-top: 14px;
    color: #8882a6;
    font-size: 16px; font-weight: 400; line-height: 1.5;
  }

  .foot {
    margin-top: 21px;
    display: flex; align-items: center;
  }
  .foot .cmd {
    font-family: "SF Mono", "JetBrains Mono", Menlo, monospace;
    font-size: 16px; font-weight: 600; color: #b9f7e5;
    padding: 10px 14px; border-radius: 8px;
    border: 1px solid rgba(65,209,255,0.24);
    background: rgba(65,209,255,0.065);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .foot .cmd span { color: #6f9bb0; }

  /* ---------------- right graph ---------------- */
  .graph {
    position: absolute; left: 744px; top: 70px;
    width: 480px; height: 500px;
  }
  .graph img {
    display: block; width: 100%; height: 100%;
    filter: drop-shadow(0 18px 30px rgba(40,35,94,0.2));
  }

  .signature {
    position: absolute; left: 64px; bottom: 34px;
    display: flex; align-items: center; gap: 10px;
    color: #77708f;
    font-size: 11.5px; font-weight: 500; letter-spacing: 0.045em;
    opacity: 0.62;
  }
  .signature::before {
    width: 22px; height: 1px;
    background: linear-gradient(90deg, #6d5ce7, #41d1ff);
    content: '';
    opacity: 0.65;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" fill="none">
      <defs>
        <linearGradient id="ee" x1="2" y1="28" x2="30" y2="4" gradientUnits="userSpaceOnUse">
          <stop stop-color="#6d5ce7"/><stop offset="1" stop-color="#41d1ff"/>
        </linearGradient>
      </defs>
      <path d="M9 16 L23 7 M9 16 L23 25" stroke="url(#ee)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="8" cy="16" r="5" fill="url(#ee)"/>
      <circle cx="24" cy="7" r="4" fill="url(#ee)"/>
      <circle cx="24" cy="25" r="4" fill="url(#ee)"/>
    </svg>
    <span>Execution Engine</span>
  </div>

  <div class="left">
    <div class="eyebrow"><div class="txt">TypeScript library · zero dependencies</div></div>

    <div class="wordmark">Execution Engine</div>

    <div class="tagline">Trace and optimize your function calls,<br>See your whole code run as a graph.</div>

    <div class="support">Captured without touching the functions themselves.</div>

    <div class="foot">
      <div class="cmd"><span>$</span> npm i execution-engine</div>
    </div>
  </div>

  <div class="graph">
    <img src="../docs/public/hero-graph-dark.svg" alt="Execution trace graph with function nodes, timings, and a cached result">
  </div>

  <div class="signature">MIT · © 2023–2026 Akram TABKA</div>
</div>
</body>
</html>
