<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" fill="none">
  <!--
    The hero artwork: a window onto the middle of a run, drawn with the same
    vocabulary as the real traces on the Examples page (theme/graph.css,
    components/FlowExample.vue). A dot on the left is the call, the bars stand in
    for its name, the duration is right-aligned, a pill is a cache or memoize hit,
    and a box inside a box is a nested run.

    The frame is a viewport, not the edge of the graph. The flow arrives already in
    progress through a box the top edge cuts in half, runs down the centre line at
    x=320 — a nested run, a parallel pair, the result — and carries on into another
    box the bottom edge cuts. Two more branches leave sideways. Nothing is clipped
    hard: the whole drawing is masked by a pair of crossed fades, one per axis, so
    it dissolves into the page at every edge.

    Geometry is a grid, not a sketch. Every plain box is 208 × 44 and centred on the
    midline; only the parallel pair leaves it, one box per lane at 152 and 488, so
    the silhouette opens out once and closes again and the fan-out mirrors the
    fan-in. The nested run is the widest thing here because it is the subject.

    Depth is carried by light rather than by geometry — no skew, so the type stays
    upright and legible. Each rank sits a little nearer the viewer than the one
    above it and takes a longer, softer shadow for it, every box is bevelled by the
    same overhead light, and the side branches are flat and dim.

    Colours are the brand tokens (tokens.scss) written out, because an <img> SVG
    cannot see the page's custom properties. Everything is translucent so the one
    asset works on the light canvas and the dark one — and in the social preview,
    which embeds this same file.
  -->
  <defs>
    <linearGradient id="flow" x1="120" y1="20" x2="520" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5c5ce7"/>
      <stop offset=".55" stop-color="#5a7ae8"/>
      <stop offset="1" stop-color="#41d1ff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5c5ce7" stop-opacity=".2"/>
      <stop offset="1" stop-color="#41d1ff" stop-opacity=".07"/>
    </linearGradient>
    <linearGradient id="glass-accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#41d1ff" stop-opacity=".17"/>
      <stop offset="1" stop-color="#41d1ff" stop-opacity=".05"/>
    </linearGradient>

    <!--
      One overhead light for every box: a lit top edge and a shaded bottom one,
      drawn just inside the border so it reads as the thickness of a slab rather
      than a second outline. The white half carries the dark canvas and the dark
      half carries the light one, so a single gradient works on both.
    -->
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset=".42" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".6" stop-color="#161238" stop-opacity="0"/>
      <stop offset="1" stop-color="#161238" stop-opacity=".17"/>
    </linearGradient>

    <radialGradient id="atmosphere">
      <stop stop-color="#5c5ce7" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#41d1ff" stop-opacity=".065"/>
      <stop offset="1" stop-color="#5c5ce7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="accent-atmosphere">
      <stop stop-color="#41d1ff" stop-opacity=".11"/>
      <stop offset="1" stop-color="#41d1ff" stop-opacity="0"/>
    </radialGradient>

    <!--
      One fade per axis, nested at the root so their alpha multiplies: that gives a
      soft border on all four sides without the corner seams four edge rects would
      leave. The vertical fade is the shallower of the two, because the boxes the
      frame cuts have to stay legible enough to read as boxes.
    -->
    <linearGradient id="fade-x" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset=".018" stop-color="white" stop-opacity=".28"/>
      <stop offset=".042" stop-color="white" stop-opacity=".7"/>
      <stop offset=".08" stop-color="white"/>
      <stop offset=".92" stop-color="white"/>
      <stop offset=".958" stop-color="white" stop-opacity=".7"/>
      <stop offset=".982" stop-color="white" stop-opacity=".28"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="edge-x" maskUnits="userSpaceOnUse" x="0" y="0" width="640" height="390">
      <rect width="640" height="390" fill="url(#fade-x)"/>
    </mask>
    <linearGradient id="fade-y" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset=".02" stop-color="white" stop-opacity=".42"/>
      <stop offset=".075" stop-color="white" stop-opacity=".88"/>
      <stop offset=".13" stop-color="white"/>
      <stop offset=".87" stop-color="white"/>
      <stop offset=".925" stop-color="white" stop-opacity=".88"/>
      <stop offset=".98" stop-color="white" stop-opacity=".42"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="edge-y" maskUnits="userSpaceOnUse" x="0" y="0" width="640" height="390">
      <rect width="640" height="390" fill="url(#fade-y)"/>
    </mask>

    <radialGradient id="background-fade" cx=".5" cy=".5" r=".72">
      <stop offset=".64" stop-color="white"/>
      <stop offset=".86" stop-color="white" stop-opacity=".62"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="background-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="640" height="390">
      <rect width="640" height="390" fill="url(#background-fade)"/>
    </mask>

    <!-- Solid heads, like the ones the Examples page draws. refX sits on the tip,
         so every edge path ends exactly on the box it points at. -->
    <marker id="arrow" viewBox="0 0 9 9" refX="9" refY="4.5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#5c5ce7" fill-opacity=".8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 9 9" refX="9" refY="4.5" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#41d1ff" fill-opacity=".9"/>
    </marker>
    <marker id="arrow-small" viewBox="0 0 7 7" refX="7" refY="3.5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#41d1ff" fill-opacity=".82"/>
    </marker>
    <!-- The branches that leave sideways: enough of a head to keep the direction
         readable, not enough to compete with the run itself. -->
    <marker id="arrow-far" viewBox="0 0 7 7" refX="7" refY="3.5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#5c5ce7" fill-opacity=".26"/>
    </marker>

    <!-- Four steps of depth, one per rank: further back is a tighter, weaker
         shadow, nearer is longer and softer. -->
    <filter id="depth-far" x="-40%" y="-70%" width="180%" height="250%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#241d63" flood-opacity=".12"/>
    </filter>
    <filter id="depth-back" x="-40%" y="-70%" width="180%" height="250%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#241d63" flood-opacity=".14"/>
    </filter>
    <filter id="depth-mid" x="-40%" y="-70%" width="180%" height="250%">
      <feDropShadow dx="1" dy="10" stdDeviation="11" flood-color="#241d63" flood-opacity=".16"/>
    </filter>
    <filter id="depth-mid-accent" x="-40%" y="-70%" width="180%" height="250%">
      <feDropShadow dx="1" dy="10" stdDeviation="11" flood-color="#241d63" flood-opacity=".12"/>
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#41d1ff" flood-opacity=".14"/>
    </filter>
    <filter id="depth-near" x="-45%" y="-80%" width="190%" height="270%">
      <feDropShadow dx="1" dy="16" stdDeviation="15" flood-color="#241d63" flood-opacity=".18"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#41d1ff" flood-opacity=".16"/>
    </filter>
  </defs>

  <style>
    .ms {
      font-family: SFMono-Regular, Consolas, Liberation Mono, monospace;
      font-size: 10px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.03em;
    }
    /* Nested calls sit in a narrower box, so their duration steps down with it. */
    .ms-sm { font-size: 9px; }
    .tag {
      font-family: SFMono-Regular, Consolas, Liberation Mono, monospace;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .02em;
    }
    .bevel { fill: none; stroke: url(#bevel); stroke-width: 1; }
    @media (max-width: 420px) { .aside { display: none; } }
  </style>

  <g mask="url(#edge-x)">
  <g mask="url(#edge-y)">

    <g mask="url(#background-mask)">
      <ellipse cx="320" cy="195" rx="356" ry="152" fill="url(#atmosphere)"/>
      <ellipse cx="400" cy="250" rx="200" ry="100" fill="url(#accent-atmosphere)"/>
    </g>

    <!--
      Work that branches off to either side and out of the window. Flat, dim and
      in mirrored pairs, so they read as the rest of the workflow rather than as a
      ragged edge.
    -->
    <g class="aside" opacity=".6">
      <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4">
        <path d="M40 76 H186" stroke="url(#flow)" stroke-opacity=".3" marker-end="url(#arrow-far)"/>
        <path d="M454 76 H600" stroke="url(#flow)" stroke-opacity=".28"/>
        <path d="M100 246 V296 Q100 310 86 310 H50" stroke="url(#flow)" stroke-opacity=".26"/>
        <path d="M540 246 V296 Q540 310 554 310 H590" stroke="url(#flow)" stroke-opacity=".26"/>
      </g>

      <g opacity=".8">
        <rect x="-140" y="54" width="180" height="44" rx="13" fill="url(#glass)" stroke="#5c5ce7" stroke-opacity=".28" stroke-width="1.1"/>
        <rect x="-38" y="73" width="58" height="7" rx="3.5" fill="#5c5ce7" fill-opacity=".24"/>

        <rect x="600" y="54" width="180" height="44" rx="13" fill="url(#glass)" stroke="#5c5ce7" stroke-opacity=".28" stroke-width="1.1"/>
        <circle cx="622" cy="76" r="4.5" fill="#5c5ce7" fill-opacity=".36"/>
        <rect x="638" y="72" width="58" height="7" rx="3.5" fill="#5c5ce7" fill-opacity=".24"/>

        <rect x="-130" y="288" width="180" height="44" rx="13" fill="url(#glass)" stroke="#5c5ce7" stroke-opacity=".28" stroke-width="1.1"/>
        <rect x="-28" y="307" width="58" height="7" rx="3.5" fill="#5c5ce7" fill-opacity=".24"/>

        <rect x="590" y="288" width="180" height="44" rx="13" fill="url(#glass-accent)" stroke="#41d1ff" stroke-opacity=".3" stroke-width="1.1"/>
        <circle cx="612" cy="310" r="4.5" fill="#41d1ff" fill-opacity=".38"/>
        <rect x="628" y="306" width="58" height="7" rx="3.5" fill="#41d1ff" fill-opacity=".26"/>
      </g>
    </g>

    <!--
      Edges first, so every box paints over the line that arrives at it. The run
      comes in from above, splits once into the pair, and meets again on the result
      before carrying on below.
    -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8">
      <path d="M320 26 V52" stroke="url(#flow)" stroke-opacity=".8" marker-end="url(#arrow)"/>
      <path d="M320 156 V165 Q320 177 308 177 H164 Q152 177 152 189 V198" stroke="url(#flow)" stroke-opacity=".74" marker-end="url(#arrow)"/>
      <path d="M320 156 V165 Q320 177 332 177 H476 Q488 177 488 189 V198" stroke="url(#flow)" stroke-opacity=".82" marker-end="url(#arrow-accent)"/>
      <path d="M152 246 V255 Q152 267 164 267 H286 Q298 267 298 279 V288" stroke="url(#flow)" stroke-opacity=".74" marker-end="url(#arrow-accent)"/>
      <path d="M488 246 V255 Q488 267 476 267 H354 Q342 267 342 279 V288" stroke="url(#flow)" stroke-opacity=".82" marker-end="url(#arrow-accent)"/>
      <path d="M320 336 V364" stroke="url(#flow)" stroke-opacity=".72" marker-end="url(#arrow-accent)"/>
    </g>

    <!-- Already in progress: the top edge cuts this one in half. -->
    <g filter="url(#depth-far)">
      <rect x="216" y="-22" width="208" height="48" rx="14" fill="url(#glass)" stroke="#5c5ce7" stroke-opacity=".62" stroke-width="1.3"/>
      <rect class="bevel" x="217" y="-21" width="206" height="46" rx="13"/>
      <circle cx="238" cy="2" r="4.5" fill="#5c5ce7" fill-opacity=".8"/>
      <rect x="254" y="-8" width="58" height="7" rx="3.5" fill="#5c5ce7" fill-opacity=".55"/>
      <rect x="254" y="6" width="40" height="6" rx="3" fill="#5c5ce7" fill-opacity=".3"/>
    </g>

    <!-- The subject: a run inside the run. Hollow dot for the parent, two calls in
         sequence, and the children sit a step nearer than the box holding them. -->
    <g filter="url(#depth-back)">
      <rect x="186" y="52" width="268" height="104" rx="18" fill="#5c5ce7" fill-opacity=".05" stroke="#5c5ce7" stroke-opacity=".55" stroke-width="1.35"/>
      <rect class="bevel" x="187" y="53" width="266" height="102" rx="17"/>
      <circle cx="206" cy="76" r="4.5" fill="none" stroke="#5c5ce7" stroke-opacity=".8" stroke-width="2"/>
      <rect x="222" y="72" width="70" height="8" rx="4" fill="#5c5ce7" fill-opacity=".5"/>
      <rect x="302" y="67" width="46" height="18" rx="9" fill="#5c5ce7" fill-opacity=".12" stroke="#5c5ce7" stroke-opacity=".26"/>
      <text class="tag" x="325" y="79.2" text-anchor="middle" fill="#4b4bd6" fill-opacity=".82">trace</text>
      <text class="ms" x="438" y="79.5" text-anchor="end" fill="#5c5ce7" fill-opacity=".62">18.7ms</text>

      <rect x="204" y="98" width="106" height="38" rx="11" fill="url(#glass)" stroke="#5c5ce7" stroke-opacity=".45" stroke-width="1.1"/>
      <rect class="bevel" x="205" y="99" width="104" height="36" rx="10"/>
      <circle cx="220" cy="117" r="3.5" fill="#5c5ce7" fill-opacity=".8"/>
      <rect x="233" y="114" width="22" height="6" rx="3" fill="#5c5ce7" fill-opacity=".5"/>
      <text class="ms ms-sm" x="298" y="120.2" text-anchor="end" fill="#5c5ce7" fill-opacity=".6">3.2ms</text>

      <path d="M310 117 H330" stroke="url(#flow)" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow-small)"/>

      <rect x="330" y="98" width="106" height="38" rx="11" fill="url(#glass-accent)" stroke="#41d1ff" stroke-opacity=".6" stroke-width="1.1"/>
      <rect class="bevel" x="331" y="99" width="104" height="36" rx="10"/>
      <circle cx="346" cy="117" r="3.5" fill="#41d1ff" fill-opacity=".9"/>
      <rect x="359" y="114" width="20" height="6" rx="3" fill="#41d1ff" fill-opacity=".62"/>
      <text class="ms ms-sm" x="424" y="120.2" text-anchor="end" fill="#2ba8cd" fill-opacity=".82">6.4ms</text>
    </g>

    <!-- The parallel pair, the only rank that leaves the centre line. Both are
         answered without running: one from the cache, one by joining a call that
         was already in flight. -->
    <g filter="url(#depth-mid)">
      <rect x="48" y="198" width="208" height="48" rx="14" fill="url(#glass)" stroke="#5c5ce7" stroke-opacity=".62" stroke-width="1.35"/>
      <rect class="bevel" x="49" y="199" width="206" height="46" rx="13"/>
      <circle cx="70" cy="222" r="4.5" fill="#5c5ce7" fill-opacity=".85"/>
      <rect x="86" y="211" width="52" height="7" rx="3.5" fill="#5c5ce7" fill-opacity=".6"/>
      <rect x="86" y="226" width="36" height="6" rx="3" fill="#5c5ce7" fill-opacity=".32"/>
      <rect x="146" y="213" width="52" height="18" rx="9" fill="#5c5ce7" fill-opacity=".12" stroke="#5c5ce7" stroke-opacity=".26"/>
      <text class="tag" x="172" y="225.2" text-anchor="middle" fill="#4b4bd6" fill-opacity=".82">cached</text>
      <text class="ms" x="240" y="225.5" text-anchor="end" fill="#5c5ce7" fill-opacity=".68">8.7ms</text>
    </g>
    <g filter="url(#depth-mid-accent)">
      <rect x="384" y="198" width="208" height="48" rx="14" fill="url(#glass-accent)" stroke="#41d1ff" stroke-opacity=".72" stroke-width="1.35"/>
      <rect class="bevel" x="385" y="199" width="206" height="46" rx="13"/>
      <circle cx="406" cy="222" r="4.5" fill="#41d1ff" fill-opacity=".92"/>
      <rect x="422" y="211" width="36" height="7" rx="3.5" fill="#41d1ff" fill-opacity=".62"/>
      <rect x="422" y="226" width="26" height="6" rx="3" fill="#41d1ff" fill-opacity=".34"/>
      <rect x="466" y="213" width="66" height="18" rx="9" fill="#41d1ff" fill-opacity=".16" stroke="#41d1ff" stroke-opacity=".4"/>
      <text class="tag" x="499" y="225.2" text-anchor="middle" fill="#2ba8cd">memoized</text>
      <text class="ms" x="576" y="225.5" text-anchor="end" fill="#2ba8cd" fill-opacity=".88">0.2ms</text>
    </g>

    <!-- Both halves meet again, measured. -->
    <g filter="url(#depth-near)">
      <rect x="216" y="288" width="208" height="48" rx="14" fill="#41d1ff" fill-opacity=".11" stroke="#41d1ff" stroke-opacity=".82" stroke-width="1.5"/>
      <rect class="bevel" x="217" y="289" width="206" height="46" rx="13"/>
      <circle cx="242" cy="312" r="10" fill="#41d1ff" fill-opacity=".08" stroke="#41d1ff" stroke-opacity=".7"/>
      <path d="M237.5 312.5 L241 316 L246.5 308.5" stroke="#41d1ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="264" y="301" width="68" height="8" rx="4" fill="#41d1ff" fill-opacity=".62"/>
      <rect x="264" y="317" width="46" height="7" rx="3.5" fill="#41d1ff" fill-opacity=".36"/>
      <text class="ms" x="408" y="315.5" text-anchor="end" fill="#2ba8cd" fill-opacity=".9">12.3ms</text>
    </g>

    <!-- And on it goes: the bottom edge cuts the next one. -->
    <g filter="url(#depth-near)">
      <rect x="216" y="364" width="208" height="48" rx="14" fill="url(#glass)" stroke="#5c5ce7" stroke-opacity=".6" stroke-width="1.3"/>
      <rect class="bevel" x="217" y="365" width="206" height="46" rx="13"/>
      <circle cx="238" cy="388" r="4.5" fill="#5c5ce7" fill-opacity=".78"/>
      <rect x="254" y="378" width="58" height="7" rx="3.5" fill="#5c5ce7" fill-opacity=".52"/>
    </g>

  </g>
  </g>
</svg>
