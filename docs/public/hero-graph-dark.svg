<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" fill="none">
  <defs>
    <linearGradient id="edge" x1="0" y1="40" x2="0" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5c5ce7"/><stop offset="1" stop-color="#41d1ff"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#18183e"/><stop offset="1" stop-color="#10102c"/>
    </linearGradient>
    <linearGradient id="cached" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#102d42"/><stop offset="1" stop-color="#0c1e34"/>
    </linearGradient>
    <radialGradient id="wash" cx="0" cy="0" r="1" gradientTransform="translate(256 250) rotate(90) scale(240 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#13133b" stop-opacity=".7"/><stop offset="1" stop-color="#0a0a1c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#9696f5" fill-opacity=".16"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-50%" width="160%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#030310" flood-opacity=".56"/>
    </filter>
    <filter id="glow" x="-40%" y="-80%" width="180%" height="260%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1878b4" flood-opacity=".38"/>
    </filter>
  </defs>

  <ellipse cx="240" cy="250" rx="235" ry="235" fill="url(#wash)"/>
  <ellipse cx="240" cy="250" rx="230" ry="230" fill="url(#dots)"/>

  <text x="24" y="32" fill="#6d6da0" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="12">engine.getTrace()  →  <tspan fill="#9696f5">nodes + edges</tspan></text>

  <g stroke="url(#edge)" stroke-width="2.2" stroke-linecap="round" opacity=".8">
    <path d="M240 109 C240 137 240 135 240 160"/>
    <path d="M200 214 C200 252 112 246 112 286"/>
    <path d="M280 214 C280 252 368 246 368 286"/>
    <path d="M112 340 C112 382 240 373 240 412"/>
    <path d="M368 340 C368 382 240 373 240 412"/>
  </g>
  <g fill="#0a0a1c" stroke="url(#edge)" stroke-width="2">
    <circle cx="240" cy="160" r="4"/><circle cx="112" cy="286" r="4"/>
    <circle cx="368" cy="286" r="4"/><circle cx="240" cy="412" r="4"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="125" y="55" width="230" height="54" rx="13" fill="url(#node)" stroke="#7878f0" stroke-opacity=".55"/>
    <circle cx="145" cy="82" r="5" fill="#7878f0"/>
    <text x="161" y="87" fill="#e2e2ff" font-family="SFMono-Semibold,Consolas,Liberation Mono,monospace" font-size="15" font-weight="600">fetchUser</text>
    <text x="331" y="86" fill="#7373ad" text-anchor="end" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="11">58.4 ms</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="105" y="160" width="270" height="54" rx="13" fill="url(#node)" stroke="#7878f0" stroke-opacity=".55"/>
    <circle cx="126" cy="187" r="5" fill="#7878f0"/>
    <text x="142" y="192" fill="#e2e2ff" font-family="SFMono-Semibold,Consolas,Liberation Mono,monospace" font-size="15" font-weight="600">calculatePrice</text>
    <text x="351" y="191" fill="#7373ad" text-anchor="end" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="11">12.3 ms</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="10" y="286" width="205" height="54" rx="13" fill="url(#node)" stroke="#7878f0" stroke-opacity=".55"/>
    <circle cx="30" cy="313" r="5" fill="#7878f0"/>
    <text x="46" y="318" fill="#e2e2ff" font-family="SFMono-Semibold,Consolas,Liberation Mono,monospace" font-size="14" font-weight="600">applyTax</text>
    <text x="194" y="317" fill="#7373ad" text-anchor="end" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="11">3.1 ms</text>
  </g>
  <g filter="url(#glow)">
    <rect x="265" y="286" width="205" height="54" rx="13" fill="url(#cached)" stroke="#41d1ff" stroke-opacity=".78"/>
    <circle cx="285" cy="313" r="5" fill="#41d1ff"/>
    <text x="301" y="318" fill="#fff" font-family="SFMono-Semibold,Consolas,Liberation Mono,monospace" font-size="14" font-weight="600">getRates</text>
    <text x="449" y="317" fill="#63c6e8" text-anchor="end" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="11">0.2 ms</text>
    <rect x="391" y="275" width="63" height="20" rx="6" fill="#41d1ff"/>
    <text x="422.5" y="289" fill="#06131c" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="9" font-weight="800" letter-spacing=".8">CACHED</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="120" y="412" width="240" height="54" rx="13" fill="url(#node)" stroke="#7878f0" stroke-opacity=".55"/>
    <circle cx="141" cy="439" r="5" fill="#7878f0"/>
    <text x="157" y="444" fill="#e2e2ff" font-family="SFMono-Semibold,Consolas,Liberation Mono,monospace" font-size="15" font-weight="600">createInvoice</text>
    <text x="337" y="443" fill="#7373ad" text-anchor="end" font-family="SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="11">8.7 ms</text>
  </g>
</svg>
